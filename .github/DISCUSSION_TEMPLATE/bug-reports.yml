title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Use this form for broken behavior, regressions, crashes, or reliability problems.
        Feature requests belong in [Ideas](https://github.com/AFK-agent-team/MemoTrace-Recovery/discussions/categories/ideas).
        Search existing discussions first and keep the report focused on one problem.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing discussions for duplicates.
          required: true
        - label: I included enough detail to reproduce or investigate the problem.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project is affected?
      options:
        - Windows desktop app
        - Linux chat export
        - Recovery CLI
        - Media or reports
        - Docs
        - Not sure
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide a minimal, deterministic repro.
      placeholder: |
        1. Start MemoTrace with a test account.
        2. Open a test chat.
        3. Select a date range.
        4. Export the chat.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: The export should contain messages from the selected range.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: The export completes with an empty file.
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: How bad is this in practice?
      options:
        - Blocks work completely
        - Major degradation or frequent failure
        - Minor bug or occasional failure
        - Cosmetic issue
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release version, commit SHA, or branch name if known.
      placeholder: main @ abc1234

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, WeChat version, MemoTrace version, and the affected command if relevant.
      placeholder: Ubuntu 24.04, WeChat 4.1.13.29, Linux chat export

  - type: textarea
    id: logs
    attributes:
      label: Logs or stack traces
      description: Paste the most relevant output only. Redact private chats, account identifiers, and secrets.
      render: shell

  - type: textarea
    id: attachments
    attributes:
      label: Screenshots, recordings, or supporting files
      description: Link redacted screenshots, recordings, or logs from a test chat. You can also attach files in a comment.

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: If you found a temporary workaround, include it.
      placeholder: Exporting a narrower date range works.
